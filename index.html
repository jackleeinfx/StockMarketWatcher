<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Market Terminal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- Technical Indicators -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/technicalindicators/3.1.0/browser.js"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Navigation -->
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-layer-group"></i> PRIME<span>MARKET</span>
        </div>

        <div class="nav-search desktop-only">
            <div class="search-wrapper">
                <select id="asset-type-select">
                    <option value="indices">Indices</option>
                    <option value="tech">Tech</option>
                    <option value="crypto">Crypto</option>
                    <option value="futures">Futures</option>
                </select>
                <div class="search-input-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="symbol-input" placeholder="Search symbol..." autocomplete="off">
                </div>
                <!-- Autocomplete Dropdown -->
                <div id="search-results" class="search-results"></div>

                <button id="search-btn">GO</button>
            </div>
        </div>

        <div class="nav-actions mobile-only">
            <button id="mobile-search-trigger" class="icon-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </nav>

    <!-- Mobile Search Overlay -->
    <div id="search-overlay" class="search-overlay">
        <div class="overlay-header">
            <div class="overlay-input-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="mobile-symbol-input" placeholder="Search Stocks, Crypto..." autocomplete="off">
            </div>
            <button id="close-search-btn">Cancel</button>
        </div>
        <div id="mobile-search-results" class="mobile-results-list"></div>
    </div>

    <!-- Ticker Tape -->
    <div class="ticker-tape-container">
        <div class="ticker-tape-track" id="ticker-tape">
            <!-- Items injected by JS -->
            <div class="ticker-item">Loading Market Data...</div>
        </div>
    </div>

    <!-- Main Dashboard Grid -->
    <div class="dashboard-grid">

        <!-- Main Column: Chart -->
        <main class="main-column">
            <div class="card chart-card">
                <div class="card-header">
                    <div class="chart-controls-left">
                        <div class="symbol-header-row">
                            <h2 id="chart-symbol">LOADING...</h2>
                            <button id="pin-btn" class="pin-btn" title="Pin to Watchlist">
                                <i class="fa-regular fa-star"></i>
                            </button>
                        </div>
                        <span id="chart-time-display">--</span>
                    </div>
                    <div class="chart-controls-right">
                        <div class="time-range-group" id="time-range-selector">
                            <button data-range="1mo" data-interval="1d" class="range-btn active">1M</button>
                            <button data-range="3mo" data-interval="1d" class="range-btn">3M</button>
                            <button data-range="6mo" data-interval="1wk" class="range-btn">6M</button>
                            <button data-range="1y" data-interval="1wk" class="range-btn">1Y</button>
                            <button data-range="5y" data-interval="1mo" class="range-btn">5Y</button>
                        </div>
                    </div>
                </div>
                <div class="chart-body" id="main-plot">
                    <div class="empty-state">
                        <i class="fa-solid fa-chart-line"></i>
                        <p>Select an asset to view analysis</p>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="indicator-toggles" id="indicator-controls">
                        <label class="toggle-pill"><input type="checkbox" value="sma20" checked> SMA 20</label>
                        <label class="toggle-pill"><input type="checkbox" value="sma50"> SMA 50</label>
                        <label class="toggle-pill"><input type="checkbox" value="ema12"> EMA 12</label>
                        <label class="toggle-pill"><input type="checkbox" value="bb"> Boll. Bands</label>
                        <label class="toggle-pill"><input type="checkbox" value="rsi" checked> RSI</label>
                        <label class="toggle-pill"><input type="checkbox" value="macd"> MACD</label>
                    </div>
                </div>
            </div>
        </main>

        <!-- Side Column: Stats & Info -->
        <aside class="side-column">

            <!-- Watchlist -->
            <div class="card watchlist-card">
                <h3>Watchlist</h3>
                <div class="watchlist-grid" id="watchlist-container">
                    <!-- Items injected by JS -->
                    <div class="empty-watchlist">No pinned items</div>
                </div>
            </div>

            <!-- Quote Card -->
            <div class="card quote-card">
                <div class="quote-header">
                    <span class="quote-label">Current Price</span>
                    <span class="live-badge">LIVE</span>
                </div>
                <div class="quote-price" id="quote-price">--</div>
                <div class="quote-change" id="quote-change">--</div>
            </div>

            <!-- Key Stats -->
            <div class="card stats-card">
                <h3>Key Statistics</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">Open</span>
                        <span class="stat-value" id="stat-open">--</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">High</span>
                        <span class="stat-value" id="stat-high">--</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Low</span>
                        <span class="stat-value" id="stat-low">--</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Volume</span>
                        <span class="stat-value" id="stat-vol">--</span>
                    </div>
                </div>
            </div>

            <!-- Fear & Greed -->
            <div class="card fg-card">
                <h3>Market Sentiment</h3>
                <div class="fg-gauge-container" id="fg-gauge"></div>
                <div class="fg-details" id="fg-text">
                    Loading Sentiment...
                </div>
                <div class="fg-history">
                    <div class="history-item">
                        <span>Yesterday</span>
                        <span id="fg-prev">--</span>
                    </div>
                    <div class="history-item">
                        <span>1 Week</span>
                        <span id="fg-week">--</span>
                    </div>
                </div>
            </div>

        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
